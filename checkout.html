<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Checkout | PressPlay Nails</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff7e8d">

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<style>
  :root {
    --primary: #ff7e8d;
    --primary-dark: #e86374;
    --text: #2b1719;
    --gray: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }

  /* --- HEADER --- */
  .checkout-header {
    background: #fff;
    padding: 20px 5%;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand-logo { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text); text-decoration: none; }
  .secure-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #065f46; background: #d1fae5; padding: 6px 12px; border-radius: 20px; font-weight: 500; }

  /* --- LAYOUT --- */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.3fr 0.9fr;
    gap: 40px;
    padding: 40px 20px;
  }

  /* --- FORMS (LEFT) --- */
  .form-section { margin-bottom: 32px; }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  
  .input-group { margin-bottom: 14px; }
  .input-row { display: flex; gap: 14px; }
  
  input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    transition: 0.2s;
    font-family: inherit;
  }
  input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(255, 126, 141, 0.1); }
  label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 500; color: var(--gray); }

  /* --- PAYMENT BOX --- */
  .payment-options { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .pay-option { 
    padding: 16px; 
    border-bottom: 1px solid var(--border); 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    transition: 0.2s;
  }
  .pay-option:last-child { border-bottom: none; }
  .pay-option:hover { background: #fdf2f3; }
  .pay-option.active { background: #fff0f1; border-left: 4px solid var(--primary); }
  
  .pay-option input { width: auto; margin: 0; }
  .pay-option label { margin: 0; font-size: 14px; font-weight: 500; flex: 1; cursor: pointer; color: var(--text); }
  .card-icons { display: flex; gap: 5px; opacity: 0.7; }
  .card-icons img { height: 20px; }

  /* Card Details Transition */
  .card-details-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    background: #fafafa;
    padding: 0 16px;
  }
  .card-details-panel.open { padding: 16px; max-height: 300px; border-bottom: 1px solid var(--border); }

  /* --- ORDER SUMMARY (RIGHT) --- */
  .order-summary {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid var(--border);
    height: fit-content;
    position: sticky;
    top: 100px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }

  .cart-item { display: flex; align-items: center; gap: 15px; margin-bottom: 16px; }
  .item-img { 
    width: 64px; height: 64px; border-radius: 8px; 
    background: #eee; object-fit: cover; border: 1px solid var(--border);
    position: relative;
  }
  .item-qty-badge {
    position: absolute; top: -8px; right: -8px;
    background: var(--gray); color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    font-size: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 600;
  }
  .item-info { flex: 1; }
  .item-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .item-meta { font-size: 12px; color: var(--gray); }
  .item-price { font-weight: 600; font-size: 14px; }

  .cost-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--gray); }
  .total-row { 
    display: flex; justify-content: space-between; 
    margin-top: 20px; padding-top: 20px; 
    border-top: 1px solid var(--border); 
    font-size: 18px; font-weight: 700; color: var(--text); 
  }
  .total-row small { font-size: 12px; font-weight: 400; color: var(--gray); }

  .checkout-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 24px;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .checkout-btn:hover { background: var(--primary-dark); box-shadow: 0 5px 15px rgba(255, 126, 141, 0.4); }
  .checkout-btn:disabled { background: #ccc; cursor: not-allowed; }

  .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--primary); text-decoration: none; }
  .back-link:hover { text-decoration: underline; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; padding: 20px; }
    .order-summary { order: -1; margin-bottom: 20px; position: relative; top: 0; }
    .checkout-header { padding: 15px 20px; }
  }
  
  /* TOAST */
  .toast { visibility: hidden; min-width: 300px; background-color: #2b1719; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); opacity: 0; transition: all 0.4s ease; }
  .toast.show { visibility: visible; opacity: 1; bottom: 50px; }

  /* ✅ phone input group (professional +92 fixed) */
  .phone-row { display: flex; gap: 10px; }
  .phone-prefix {
    width: 92px;
    text-align: center;
    background: #f3f4f6;
    color: #666;
    font-weight: 600;
    cursor: default;
  }
  .phone-number { flex: 1; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<header class="checkout-header">
  <a href="index.html" class="brand-logo">PressPlay Nails</a>
  <div class="secure-badge"><i class='bx bxs-lock-alt'></i> Secure Checkout</div>
</header>

<div class="container">
  
  <div class="form-column">
    
    <div class="form-section">
      <div class="section-title">Contact Information</div>
      <div class="input-group">
        <input type="email" id="email" placeholder="Email address" required>
      </div>

      <!-- ✅ Phone is OPTIONAL (fixed +92 + 10 digits if provided) -->
      <div class="input-group">
        <div class="phone-row">
          <input class="phone-prefix" type="text" value="+92" readonly>
          <input class="phone-number" type="text" id="phone" placeholder="3XXXXXXXXX" maxlength="10" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Shipping Address</div>
      <div class="input-group">
        <div class="input-row">
          <input type="text" id="fName" placeholder="First name" required>
          <input type="text" id="lName" placeholder="Last name" required>
        </div>
      </div>
      <div class="input-group">
        <input type="text" id="address" placeholder="Address" required>
      </div>
      <div class="input-group">
        <input type="text" id="apartment" placeholder="Apartment, suite, etc. (optional)">
      </div>
      <div class="input-group">
        <div class="input-row">
          <select id="city" required>
            <option value="" disabled selected>Select City</option>
          </select>
          <input type="text" id="zip" placeholder="Postal Code" required>
        </div>
      </div>
      <div class="input-group">
        <input type="text" value="Pakistan" readonly style="background:#f3f4f6; color:#666;">
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Payment Method</div>
      <div class="payment-options">
        
        <div class="pay-option active" id="opt-card" onclick="selectPayment('card')">
          <input type="radio" name="payment" value="card" checked>
          <label>Credit / Debit Card</label>
          <div class="card-icons">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png" alt="Visa">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
          </div>
        </div>
        
        <div class="card-details-panel open" id="card-panel">
          <div class="input-group">
            <input type="text" placeholder="Card number" maxlength="19" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
          </div>
          <div class="input-group">
            <div class="input-row">
              <input type="text" placeholder="MM" maxlength="2" style="width:70px; text-align:center;" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              <span style="align-self:center; font-weight:bold; color:#ccc;">/</span>
              <input type="text" placeholder="YY" maxlength="2" style="width:70px; text-align:center;" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              
              <input type="text" placeholder="CVC" maxlength="3" style="flex:1;" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
          </div>
          <div class="input-group"><input placeholder="Name on card"></div>
        </div>

        <div class="pay-option" id="opt-cod" onclick="selectPayment('cod')">
          <input type="radio" name="payment" value="cod">
          <label>Cash on Delivery (COD)</label>
        </div>

      </div>
    </div>

    <button class="checkout-btn" id="payButton" onclick="handlePayment()">Pay Now</button>
    <a href="index.html" class="back-link"><i class='bx bx-left-arrow-alt'></i> Return to Store</a>
  </div>

  <div class="order-summary">
    <div class="section-title">Order Summary</div>
    <div id="summaryItems">
      <p style="color:#888; text-align:center;">Loading cart...</p>
    </div>

    <div style="margin-top:20px; padding-top:20px; border-top:1px solid #eee;">
      <div class="cost-row">
        <span>Subtotal</span>
        <span id="subtotalPrice">PKR 0</span>
      </div>
      <div class="cost-row">
        <span>Shipping</span>
        <span id="shippingPrice" style="color:green;">Free</span>
      </div>
    </div>

    <div class="total-row">
      <span>Total <small>PKR</small></span>
      <span id="totalPrice">PKR 0</span>
    </div>
  </div>

</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { collection, addDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const payButton = document.getElementById("payButton");

  const citySelect = document.getElementById("city");
  const shippingEl = document.getElementById("shippingPrice");

  let SHIPPING_RATES = {};   // { "Karachi": 0, "Lahore": 200, ... }
  let selectedShipping = 0;

  // ✅ Ensure user session exists (anonymous for guests)
  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
    } else {
      try {
        const cred = await signInAnonymously(auth);
        currentUser = cred.user;
      } catch (e) {
        console.error("Anonymous sign-in failed:", e);
      }
    }
  });

  function escapeHtml(str) {
    return String(str ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function safeImg(url) {
    const u = String(url || "").trim();
    return u.length ? u : "https://placehold.co/100x100/E6D8C5/2b1719?text=Nails";
  }

  function num(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }

  function formatPKR(n) {
    return "PKR " + num(n).toLocaleString();
  }

  function setShippingUI(value) {
    const v = num(value);
    selectedShipping = v;

    if (v <= 0) {
      shippingEl.textContent = "Free";
      shippingEl.style.color = "green";
    } else {
      shippingEl.textContent = formatPKR(v);
      shippingEl.style.color = "";
    }
  }

  function computeSubtotal() {
    return (cart || []).reduce((sum, item) => {
      const price = num(item.price);
      const qty = Math.max(0, num(item.qty));
      return sum + (price * qty);
    }, 0);
  }

  function updateTotalsUI() {
    const subtotalEl = document.getElementById("subtotalPrice");
    const totalEl = document.getElementById("totalPrice");

    const subtotal = computeSubtotal();
    const grandTotal = subtotal + num(selectedShipping);

    subtotalEl.innerText = formatPKR(subtotal);
    totalEl.innerText = formatPKR(grandTotal);
  }

  function isValidEmail(email) {
    const e = String(email || "").trim();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  function isValidName(v) {
    const s = String(v || "").trim();
    return s.length >= 2;
  }

  function isValidAddress(v) {
    const s = String(v || "").trim();
    return s.length >= 6;
  }

  function isValidZip(v) {
    const s = String(v || "").trim();
    // Pakistan postal codes are 5 digits, but allow 4-6 to avoid blocking edge cases
    return /^\d{4,6}$/.test(s);
  }

  // ✅ Phone: fixed +92, user types 10 digits (OPTIONAL)
  // - digits only
  // - if user types 0 first -> drop it
  // - accept starting with "3" (mobile) => final format: +92 3XXXXXXXXX
  const phoneInput = document.getElementById("phone");

  function normalizePhoneDigits(raw) {
    let v = String(raw || "").replace(/[^0-9]/g, "");

    // If user pasted full number like 03XXXXXXXXX (11) -> drop leading 0
    if (v.startsWith("0")) v = v.slice(1);

    // If user pasted 92XXXXXXXXXX -> remove 92 (UI already has +92)
    if (v.startsWith("92")) {
      v = v.slice(2);
      if (v.startsWith("0")) v = v.slice(1);
    }

    // limit to 10 digits
    v = v.slice(0, 10);

    return v;
  }

  phoneInput.addEventListener("input", () => {
    phoneInput.value = normalizePhoneDigits(phoneInput.value);
  });

  phoneInput.addEventListener("paste", (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text");
    phoneInput.value = normalizePhoneDigits(text);
  });

  function isValidPakPhone10Digits(value) {
    // After +92 fixed: must be 10 digits
    // Must start with 3 (mobile numbers): 3XXXXXXXXX
    const v = String(value || "").trim();
    return /^3\d{9}$/.test(v);
  }

  function fullPhoneE164() {
    // +92 + 10 digits (starting with 3)
    return "+92" + String(phoneInput.value || "").trim();
  }

  async function loadShippingCities() {
    // Reads shipping cities/rates from Firestore:
    // Collection: "shippingRates"
    // Each document should have:
    //   - city: "Karachi"
    //   - price: 0 (or any number)
    //   - enabled: true
    //
    // If nothing exists, it falls back to your old static list.

    SHIPPING_RATES = {};
    citySelect.innerHTML = '<option value="" disabled selected>Select City</option>';

    try {
      const snap = await getDocs(collection(db, "shippingRates"));
      const rows = [];

      snap.forEach(docSnap => {
        const d = docSnap.data() || {};
        const city = String(d.city || d.name || docSnap.id || "").trim();
        const enabled = (d.enabled === undefined) ? true : !!d.enabled;
        const price = num(d.price);

        if (city && enabled) rows.push({ city, price });
      });

      rows.sort((a, b) => a.city.localeCompare(b.city));

      if (rows.length) {
        rows.forEach(r => {
          SHIPPING_RATES[r.city] = r.price;
          const opt = document.createElement("option");
          opt.value = r.city;
          opt.textContent = r.city;
          citySelect.appendChild(opt);
        });
      } else {
        throw new Error("No enabled shippingRates found");
      }
    } catch (err) {
      // Fallback (your original cities list) + Free shipping
      const fallbackCities = [
        "Karachi","Lahore","Islamabad","Rawalpindi","Faisalabad","Multan","Peshawar","Quetta",
        "Gujranwala","Sialkot","Hyderabad","Bahawalpur","Sargodha","Abbottabad","Other"
      ];
      fallbackCities.forEach(c => {
        SHIPPING_RATES[c] = 0;
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        citySelect.appendChild(opt);
      });
    }

    // Default shipping display
    setShippingUI(0);
    updateTotalsUI();
  }

  // --- INITIAL LOAD ---
  await loadShippingCities();

  // --- WHEN CITY CHANGES -> update shipping + totals ---
  citySelect.addEventListener("change", () => {
    const city = citySelect.value;
    const fee = (city && SHIPPING_RATES[city] !== undefined) ? SHIPPING_RATES[city] : 0;
    setShippingUI(fee);
    updateTotalsUI();
  });

  // --- INITIAL RENDER ---
  renderSummary();

  // --- RENDER CART ---
  function renderSummary() {
    const container = document.getElementById("summaryItems");

    if (cart.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">Your cart is empty.</p>';
      payButton.disabled = true;
      payButton.innerText = "Cart is Empty";
      payButton.style.background = "#ccc";
      updateTotalsUI();
      return;
    }

    container.innerHTML = "";

    cart.forEach(item => {
      const price = num(item.price);
      const qty = Math.max(0, num(item.qty));
      const itemTotal = price * qty;

      const imgUrl = safeImg(item.image);

      container.innerHTML += `
        <div class="cart-item">
          <div style="position:relative;">
            <img src="${escapeHtml(imgUrl)}" class="item-img" alt="Item" onerror="this.src='https://placehold.co/100x100/E6D8C5/2b1719?text=Nails'; this.alt='Image unavailable';">
            <div class="item-qty-badge">${qty}</div>
          </div>
          <div class="item-info">
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="item-meta">Standard Shipping</div>
          </div>
          <div class="item-price">PKR ${itemTotal.toLocaleString()}</div>
        </div>
      `;
    });

    updateTotalsUI();
  }

  // --- PAYMENT TOGGLE UI ---
  window.selectPayment = function(type) {
    const cardOpt = document.getElementById("opt-card");
    const codOpt = document.getElementById("opt-cod");
    const panel = document.getElementById("card-panel");
    const radioCard = document.querySelector('input[value="card"]');
    const radioCod = document.querySelector('input[value="cod"]');

    if(type === 'card') {
      cardOpt.classList.add("active");
      codOpt.classList.remove("active");
      panel.classList.add("open");
      payButton.innerText = "Pay Now";
      radioCard.checked = true;
    } else {
      codOpt.classList.add("active");
      cardOpt.classList.remove("active");
      panel.classList.remove("open");
      payButton.innerText = "Complete Order";
      radioCod.checked = true;
    }
  };

  // --- SUBMIT ORDER ---
  window.handlePayment = async function() {
    if (cart.length === 0) return;

    // Ensure signed-in user exists (anonymous for guests) before creating order
    if (!auth.currentUser) {
      try {
        const cred = await signInAnonymously(auth);
        currentUser = cred.user;
      } catch (e) {
        console.error("Anonymous sign-in failed:", e);
        showToast("Could not start guest checkout. Please refresh and try again.");
        return;
      }
    } else {
      currentUser = auth.currentUser;
    }

    // 1. Validation
    const email = document.getElementById('email').value.trim();
    const phone10 = document.getElementById('phone').value.trim(); // OPTIONAL
    const fName = document.getElementById('fName').value.trim();
    const lName = document.getElementById('lName').value.trim();
    const address = document.getElementById('address').value.trim();
    const apartment = document.getElementById('apartment').value.trim();
    const city = document.getElementById('city').value; // Value from Dropdown
    const zip = document.getElementById('zip').value.trim();

    // ✅ Phone removed from required list
    if(!email || !fName || !lName || !address || !city || !zip) {
      showToast("Please fill in all shipping details.");
      return;
    }

    if (!isValidEmail(email)) {
      showToast("Please enter a valid email address.");
      return;
    }

    // ✅ Phone is optional: validate only if provided
    if (phone10 && !isValidPakPhone10Digits(phone10)) {
      showToast("Please enter a valid Pakistan mobile number. Example: +92 3XXXXXXXXX");
      return;
    }

    if (!isValidName(fName) || !isValidName(lName)) {
      showToast("Please enter a valid first and last name.");
      return;
    }

    if (!isValidAddress(address)) {
      showToast("Please enter a valid address.");
      return;
    }

    if (!isValidZip(zip)) {
      showToast("Please enter a valid postal code.");
      return;
    }

    // ensure selected city is actually in allowed list (admin-side cities)
    if (SHIPPING_RATES[city] === undefined) {
      showToast("Selected city is not available for delivery.");
      return;
    }

    // 2. Button Loading State
    const originalText = payButton.innerText;
    payButton.disabled = true;
    payButton.innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Processing...";

    try {
      const selectedPayment = document.querySelector('input[name="payment"]:checked').value;

      // normalize cart numbers
      const cleanItems = (cart || []).map(it => ({
        ...it,
        price: num(it.price),
        qty: Math.max(0, num(it.qty))
      }));

      const subtotalAmount = cleanItems.reduce((sum, item) => sum + (num(item.price) * num(item.qty)), 0);
      const shippingFee = num(SHIPPING_RATES[city]);
      const totalAmount = subtotalAmount + shippingFee;

      const fullName = `${fName} ${lName}`.trim();

      // ✅ phone stored as empty string if not provided
      const phoneFull = phone10 ? fullPhoneE164() : "";

      const orderData = {
        uid: currentUser.uid,

        customer: {
          name: fullName,
          email: email,
          phone: phoneFull,
          address: address,
          apartment: apartment,
          city: city,
          zip: zip,
          country: "Pakistan"
        },

        // ✅ add shipping object for admin.html compatibility (without removing your customer object)
        shipping: {
          name: fullName,
          email: email,
          phone: phoneFull,
          line1: address,
          line2: apartment,
          city: city,
          postalCode: zip,
          country: "Pakistan"
        },

        items: cleanItems,
        subtotal: subtotalAmount,
        shippingFee: shippingFee,
        total: totalAmount,
        paymentMethod: selectedPayment,
        status: "Pending",
        createdAt: serverTimestamp()
      };

      // 3. Save to Firebase
      await addDoc(collection(db, "orders"), orderData);

      // 4. Success
      localStorage.removeItem("cart");
      showToast("Order Confirmed! Redirecting...");
      
      setTimeout(() => {
        window.location.href = "index.html"; 
      }, 2000);

    } catch (error) {
      console.error("Order Error:", error);
      showToast("Payment failed. Please try again.");
      payButton.disabled = false;
      payButton.innerText = originalText;
    }
  };

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "toast show";
    setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
  }
</script>

</body>
</html>
