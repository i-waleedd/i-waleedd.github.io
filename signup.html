<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up | VNAILS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<style>
  :root{
    --primary:#ff7e8d;
    --primary-hover:#ff6b7d;

    /* ✅ Match other pages */
    --bg:#ffffff;
    --text:#2b1719;
    --muted:rgba(43,23,25,.72);
    --border:rgba(0,0,0,0.12);
    --soft:rgba(0,0,0,0.04);

    --card:#ffffff;
    --shadow:0 22px 70px rgba(0,0,0,0.14);

    /* ✅ Signup hero image (swap anytime) */
    --hero-image: url("https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=1600&q=75");
  }

  * { box-sizing: border-box; margin:0; padding:0; font-family:'Poppins',sans-serif; }

  body{
    background: radial-gradient(1100px 600px at 20% 20%, rgba(255,126,141,0.10), transparent 55%),
                radial-gradient(900px 600px at 80% 40%, rgba(0,0,0,0.06), transparent 60%),
                var(--bg);
    color: var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 22px;
  }

  /* ===== Split Layout (PC) ===== */
  .auth-shell{
    width: min(1080px, 96vw);
    background: var(--card);
    border: 1px solid rgba(0,0,0,0.10);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    min-height: 660px;
  }

  /* Left hero panel */
  .auth-hero{
    position: relative;
    background: var(--soft);
    overflow: hidden;
  }

  .auth-hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: var(--hero-image);
    background-size: cover;
    background-position: center;
    transform: scale(1.02);
    filter: saturate(0.95) contrast(1.05);
  }

  .auth-hero::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.45) 65%, rgba(0,0,0,0.62) 100%);
  }

  .hero-content{
    position:absolute;
    left: 34px;
    right: 34px;
    bottom: 34px;
    color: #fff;
    z-index: 2;
  }

  .hero-title{
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 0.2px;
    line-height: 1.05;
    text-shadow: 0 14px 40px rgba(0,0,0,0.35);
    margin-bottom: 10px;
  }

  .hero-sub{
    max-width: 460px;
    font-size: 13px;
    line-height: 1.6;
    color: rgba(255,255,255,0.88);
  }

  /* Right form panel */
  .auth-form{
    position: relative;
    padding: 34px 34px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .top-link{
    position: absolute;
    top: 16px;
    right: 18px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(43,23,25,0.55);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 8px 10px;
    border-radius: 999px;
    transition: .2s;
  }
  .top-link:hover{
    color: var(--text);
    background: rgba(0,0,0,0.04);
  }

  .brand{
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }

  .subtitle{
    font-size: 13px;
    color: rgba(43,23,25,0.70);
    margin-bottom: 20px;
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
    color: rgba(43,23,25,0.82);
    letter-spacing: 0.2px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.14);
    font-size:14px;
    outline:none;
    background:#fff;
    color: var(--text);
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus{
    border-color: rgba(255,126,141,0.75);
    box-shadow: 0 0 0 3px rgba(255,126,141,0.15);
  }

  .signup-btn{
    width:100%;
    padding:14px;
    background: var(--primary);
    color:#fff;
    border:none;
    border-radius:999px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:all .25s ease;
    box-shadow: 0 14px 28px rgba(255,126,141,0.25);
    margin-top: 6px;
  }
  .signup-btn:hover{
    background: var(--primary-hover);
    transform:translateY(-2px);
  }
  .signup-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
  }

  /* GOOGLE BUTTON STYLES */
  .divider{
    display:flex;
    align-items:center;
    margin: 18px 0;
    color: rgba(43,23,25,0.55);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .3px;
    text-transform: uppercase;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: rgba(0,0,0,0.12);
  }
  .divider span{ padding: 0 10px; }

  .google-btn{
    width:100%;
    padding:12px;
    background:#fff;
    color:#333;
    border:1px solid rgba(0,0,0,0.14);
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.2s;
  }
  .google-btn:hover{
    background: rgba(0,0,0,0.02);
    border-color: rgba(255,126,141,0.45);
  }
  .google-btn img{ width:18px; height:18px; }
  .google-btn:disabled{ opacity:.65; cursor:not-allowed; }

  .error{
    margin-top:14px;
    color:#991b1b;
    font-size:13px;
    display:none;
    text-align:center;
    padding:10px;
    background: rgba(153,27,27,0.08);
    border-radius:12px;
    border: 1px solid rgba(153,27,27,0.18);
    font-weight:700;
  }

  .footer-text{
    margin-top: 18px;
    text-align:center;
    font-size:13px;
    color: rgba(43,23,25,0.70);
  }
  .footer-text a{
    color: var(--primary);
    font-weight:800;
    text-decoration:none;
  }
  .footer-text a:hover{ color: var(--primary-hover); }

  @media(max-width: 900px){
    body{ padding: 16px; }
    .auth-shell{
      grid-template-columns: 1fr;
      min-height: unset;
      border-radius: 18px;
    }
    .auth-hero{ min-height: 260px; }
    .hero-content{
      left: 20px;
      right: 20px;
      bottom: 20px;
    }
    .hero-title{ font-size: 32px; }
    .auth-form{ padding: 26px 20px 20px; }
    .top-link{ top: 12px; right: 12px; }
  }

  @media(max-width:480px){
    .auth-hero{ min-height: 220px; }
    .hero-title{ font-size: 28px; }
  }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="auth-hero" aria-hidden="true">
    <div class="hero-content">
      <div class="hero-title">Join VNAILS.</div>
      <div class="hero-sub">Create your account to save favorites, track orders, and get early access to new drops.</div>
    </div>
  </div>

  <div class="auth-form">
    <a class="top-link" href="index.html">Back to Store</a>

    <div class="brand">VNAILS</div>
    <div class="subtitle">Create your account ✨</div>

    <!-- ✅ FIX: real form (Enter works reliably + accessibility) -->
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
      </div>

      <button class="signup-btn" id="signupBtn" type="submit">Sign Up</button>
    </form>

    <div class="divider"><span>OR</span></div>

    <button class="google-btn" id="googleBtn" type="button">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
      Continue with Google
    </button>

    <div class="error" id="errorMsg" role="alert" aria-live="polite"></div>

    <div class="footer-text">
      Already have an account?
      <a href="login.html">Login here</a>
    </div>
  </div>
</div>

<script type="module">
import { auth } from "./firebase.js";
import {
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  updateProfile
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* =====================
   ✅ Safe redirect support (optional)
   Example: signup.html?redirect=wishlist.html
===================== */
function getSafeRedirect() {
  const params = new URLSearchParams(window.location.search);
  const raw = (params.get("redirect") || "").trim();

  if (!raw) return "";

  const ok =
    /^[a-zA-Z0-9/_-]+\.html$/.test(raw) &&
    !raw.includes("..") &&
    !raw.startsWith("/") &&
    !raw.startsWith("//") &&
    !raw.startsWith("http");

  return ok ? raw : "";
}

let hideTimer = null;
function showError(msg) {
  const el = document.getElementById("errorMsg");
  if (!el) return;

  if (hideTimer) clearTimeout(hideTimer);

  el.textContent = msg;
  el.style.display = "block";

  hideTimer = setTimeout(() => {
    el.style.display = "none";
    el.textContent = "";
  }, 4200);
}

function setLoading(isLoading) {
  const signupBtn = document.getElementById("signupBtn");
  const googleBtn = document.getElementById("googleBtn");

  signupBtn.disabled = isLoading;
  googleBtn.disabled = isLoading;

  signupBtn.textContent = isLoading ? "Creating Account..." : "Sign Up";
}

/* ✅ Friendlier error mapping */
function friendlyFirebaseError(err) {
  const code = (err && err.code) ? String(err.code) : "";
  const msg = (err && err.message) ? String(err.message) : "Something went wrong.";

  if (code.includes("auth/email-already-in-use")) return "This email is already registered.";
  if (code.includes("auth/invalid-email")) return "Please enter a valid email address.";
  if (code.includes("auth/weak-password")) return "Password is too weak. Use at least 6 characters.";
  if (code.includes("auth/network-request-failed")) return "Network error. Please check your internet and try again.";
  if (code.includes("auth/popup-closed-by-user")) return "Google sign-up was cancelled.";
  if (code.includes("auth/account-exists-with-different-credential")) return "This email is already linked to another sign-in method.";

  // fallback
  if (msg.toLowerCase().includes("email-already-in-use")) return "This email is already registered.";
  if (msg.toLowerCase().includes("weak-password")) return "Password is too weak. Use at least 6 characters.";
  return "Sign up failed. Please try again.";
}

function validateEmailSimple(email) {
  // simple, practical email check (not overly strict)
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
}

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("signupForm");
  const googleBtn = document.getElementById("googleBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    // Validation (better UX)
    if (!email || !password || !confirmPassword) {
      showError("Please fill in all fields.");
      return;
    }

    if (!validateEmailSimple(email)) {
      showError("Please enter a valid email address.");
      return;
    }

    if (password.length < 6) {
      showError("Password must be at least 6 characters.");
      return;
    }

    if (password !== confirmPassword) {
      showError("Passwords do not match.");
      return;
    }

    setLoading(true);

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);

      // Optional: set a simple display name from email prefix (harmless + nice for reviews)
      try {
        const prefix = (email.split("@")[0] || "").replace(/[._-]+/g, " ").trim();
        if (prefix) await updateProfile(cred.user, { displayName: prefix });
      } catch {
        // ignore profile failures
      }

      const safeRedirect = getSafeRedirect();
      window.location.href = safeRedirect || "index.html";
    } catch (err) {
      showError(friendlyFirebaseError(err));
      setLoading(false);
    }
  });

  googleBtn.addEventListener("click", async () => {
    setLoading(true);

    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);

      const safeRedirect = getSafeRedirect();
      window.location.href = safeRedirect || "index.html";
    } catch (err) {
      showError(friendlyFirebaseError(err));
      setLoading(false);
    }
  });
});
</script>

</body>
</html>
